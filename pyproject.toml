[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "certified-dose"
version = "0.4.0"
description = "Formal reachability-analysis safety layer for process-control chemical dosing"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "certified-dose Contributors" }
]
keywords = [
    "control-theory",
    "formal-verification",
    "interval-arithmetic",
    "process-control",
    "reachability-analysis",
    "water-treatment",
    "safety-layer"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dashboard = [
    "streamlit>=1.30.0",
    "plotly>=5.18.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.90.0",
    "mypy>=1.7.0",
    "ruff>=0.1.6",
    "black>=23.11.0",
    "matplotlib>=3.8.0",
    "cosmic-ray>=8.7.0",
    "mutmut>=3.7.0",
]

[project.scripts]
certified-dose = "certified_dose.cli:app"

[project.urls]
Homepage = "https://github.com/Raj123-0/certified-dose"
Repository = "https://github.com/Raj123-0/certified-dose.git"
Issues = "https://github.com/Raj123-0/certified-dose/issues"

[tool.hatch.build.targets.wheel]
packages = ["certified_dose"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line length handled by formatter
    "B008", # do not perform function calls in argument defaults (needed for Typer Option/Argument)
]

[tool.black]
line-length = 88
target-version = ["py311", "py312"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "streamlit.*",
    "plotly.*",
    "rich.*",
]
ignore_missing_imports = true

[tool.coverage.run]
omit = [
    "certified_dose/dashboard.py",
]

[tool.coverage.report]
fail_under = 90.0
show_missing = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
